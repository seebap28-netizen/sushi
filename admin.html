<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Monitor de Cocina</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .refresh-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .order-id {
            font-weight: bold;
            color: var(--accent);
        }

        .order-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }

        .client-info-box {
            background-color: var(--bg-dark);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .client-info-box a {
            color: var(--accent);
            text-decoration: none;
        }

        .order-items-list {
            list-style: none;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .order-items-list li {
            padding: 4px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .order-total {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
            color: var(--success);
        }

        .order-actions {
            display: flex;
            gap: 10px;
        }

        .btn-approve {
            flex: 1;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reject {
            flex: 1;
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍🍳 Monitor de Cocina / Administración</h1>
        <button class="refresh-btn" onclick="renderOrders()">🔄 Actualizar Pedidos</button>
    </header>

    <main>
        <div class="orders-container" id="ordersContainer">
            <!-- Las tarjetas de pedidos se cargarán aquí -->
        </div>
    </main>

    <script>
        function renderOrders() {
            const ordersContainer = document.getElementById("ordersContainer");
            const orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];

            if (orders.length === 0) {
                ordersContainer.innerHTML = `<p style="color: var(--text-secondary); grid-column: 1/-1;">No hay pedidos en este momento.</p>`;
                return;
            }

            ordersContainer.innerHTML = orders.map(order => {
                const c = order.cliente || {};
                return `
                <div class="order-card">
                    <div>
                        <div class="order-card-header">
                            <span class="order-id">${order.id}</span>
                            <span class="order-status" style="background-color: ${order.estado === 'Aprobado' ? '#22c55e' : '#f59e0b'}">
                                ${order.estado}
                            </span>
                        </div>

                        <div class="client-info-box">
                            <div><strong>Cliente:</strong> ${c.nombre || '-'}</div>
                            <div><strong>Teléfono:</strong> <a href="tel:${c.telefono}">${c.telefono || '-'}</a></div>
                            <div><strong>Correo:</strong> ${c.correo || '-'}</div>
                            <div><strong>Dirección:</strong> ${c.direccion || '-'}</div>
                            <div><strong>Pago:</strong> ${c.pago || '-'}</div>
                        </div>

                        <ul class="order-items-list">
                            ${order.items.map(i => `<li><b>${i.cantidad}x</b> ${i.nombre}</li>`).join('')}
                        </ul>
                    </div>

                    <div>
                        <div class="order-total">$${order.total.toLocaleString('es-CL')}</div>

                        ${order.estado === 'Pendiente' ? `
                            <div class="order-actions">
                                <button class="btn-approve" onclick="updateOrderStatus('${order.id}', 'Aprobado')">Aprobar</button>
                                <button class="btn-reject" onclick="deleteOrder('${order.id}')">Rechazar</button>
                            </div>
                        ` : `
                            <button class="btn-reject" style="width: 100%; background-color: #4a5568;" onclick="deleteOrder('${order.id}')">Limpiar de Pantalla</button>
                        `}
                    </div>
                </div>
            `;
            }).join('');
        }

        function updateOrderStatus(id, newStatus) {
            let orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            orders = orders.map(o => o.id === id ? { ...o, estado: newStatus } : o);
            localStorage.setItem("sushiInternalOrders", JSON.stringify(orders));
            renderOrders();
        }

        function deleteOrder(id) {
            let orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            orders = orders.filter(o => o.id !== id);
            localStorage.setItem("sushiInternalOrders", JSON.stringify(orders));
            renderOrders();
        }

        // Cargar automáticamente al entrar y recargar cada 10 segundos
        renderOrders();
        setInterval(renderOrders, 10000);
    </script>
</body>
</html>
