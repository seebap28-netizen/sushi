<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Sushi - Sabores de Tokio</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --card-border: #21262d;
            --accent-color: #ff4757;
            --primary-btn: #3fb950;
            --warning-color: #d29922;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 110px;
        }

        /* BARRA SUPERIOR CON BOTÓN ADMIN VISIBLE */
        header {
            padding: 16px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .header-container {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        header h1 {
            font-size: 1.3rem;
            letter-spacing: 1px;
            font-weight: 800;
        }

        header p {
            color: var(--accent-color);
            margin-top: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Botón Admin resaltado */
        .btn-admin-header {
            background-color: #21262d;
            color: #ffffff !important;
            border: 1px solid var(--accent-color);
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .btn-admin-header:hover {
            background-color: var(--accent-color);
        }

        /* Navegación Rápida */
        .quick-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            scrollbar-width: none;
        }

        .quick-nav::-webkit-scrollbar { display: none; }

        .quick-nav a {
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
            white-space: nowrap;
        }

        /* Categorías y Productos */
        .category-section {
            scroll-margin-top: 20px;
            margin-bottom: 28px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .category-title {
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-list { display: flex; flex-direction: column; gap: 12px; }

        .menu-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .img-container { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
        .menu-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .badge-promo {
            position: absolute;
            top: 4px;
            left: 4px;
            background-color: var(--accent-color);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 800;
        }

        .item-content { flex: 1; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .item-price { color: var(--accent-color); font-weight: 700; font-size: 0.95rem; }
        .item-desc { color: var(--text-muted); font-size: 0.78rem; }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--card-border);
        }

        .btn-qty {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .qty-number { font-weight: 700; font-size: 0.85rem; min-width: 20px; text-align: center; }

        /* Carrito Flotante */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background-color: #1c2128;
            border: 1px solid var(--primary-btn);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .btn-open-cart {
            background-color: var(--primary-btn);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 14px; width: 100%; max-width: 450px;
            max-height: 85vh; display: flex; flex-direction: column;
            border: 1px solid var(--card-border);
        }

        .modal-header { padding: 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px; border-top: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 12px; }
        .btn-checkout { background-color: var(--primary-btn); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <!-- CABECERA CON BOTÓN ADMIN INCLUIDO EN EL HTML DIRECTO -->
    <header>
        <div class="header-container">
            <div>
                <h1>SABORES DE TOKIO</h1>
                <p>Carta Digital</p>
            </div>
            <!-- Botón Admin directo -->
            <a href="admin.html" class="btn-admin-header">
                ⚙️ Admin
            </a>
        </div>
    </header>

    <!-- Navegación -->
    <div class="quick-nav">
        <a href="#mas-vendidos">🔥 Más Vendidos</a>
        <a href="#promos">🏷️ Promos</a>
        <a href="#para-uno">👤 Para Uno</a>
        <a href="#handrolls">🌯 Handrolls</a>
        <a href="#gohan">🍚 Gohan</a>
        <a href="#bebestibles">🥤 Bebestibles</a>
    </div>

    <!-- Menú -->
    <div id="sectionsContainer"></div>

    <!-- Carrito Flotante -->
    <div class="cart-bar" id="cartBar" style="display: none;">
        <div>
            <span id="cartCount" style="font-size: 0.8rem; color: var(--text-muted); display: block;">0 ítems</span>
            <span id="cartTotal" style="font-size: 1.1rem; font-weight: 800; color: #fff;">$0</span>
        </div>
        <button class="btn-open-cart" onclick="openCartModal()">Ver Carrito 🛒</button>
    </div>

    <!-- Modal Carrito -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Resumen de tu Pedido</h2>
                <button style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalCartList"></div>
            <div class="modal-footer" id="modalFooter">
                <div style="display:flex; justify-content:space-between; font-weight:800;">
                    <span>Total:</span>
                    <span id="modalTotal">$0</span>
                </div>
                <button class="btn-checkout" onclick="processInternalOrder()">Confirmar y Enviar Pedido 🛍️</button>
            </div>
        </div>
    </div>

    <script>
        const categoriesMap = {
            'mas-vendidos': '🔥 Más Vendidos',
            'promos': '🏷️ Promos',
            'para-uno': '👤 Para Uno',
            'handrolls': '🌯 Handrolls',
            'gohan': '🍚 Gohan',
            'bebestibles': '🥤 Bebestibles'
        };

        const initialPromos = [
            { id: 1, nombre: "Promo 1: Sake Mix", precio: "$8.900", badge: "TOP VENDIDO", categoria: "mas-vendidos", descripcion: "10 pcs Sake Avocado Roll + 2 Nigiris + Bebida.", imagen: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=300&q=80" },
            { id: 2, nombre: "Promo Duo Tokio", precio: "$14.900", badge: "2x1 PROMO", categoria: "promos", descripcion: "10 pcs Ebi Roll + 10 pcs Tori Roll + 4 Gyozas.", imagen: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=300&q=80" },
            { id: 3, nombre: "Combo Personal", precio: "$6.500", badge: "SOLO PARA 1", categoria: "para-uno", descripcion: "10 pcs Rolls a elección + Bebida 350ml.", imagen: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=300&q=80" }
        ];

        let cart = {};

        function parsePrice(p) { return parseInt(p.replace(/[^0-9]/g, '')) || 0; }
        function formatPrice(n) { return '$' + n.toLocaleString('es-CL'); }

        function renderMenu() {
            const container = document.getElementById("sectionsContainer");
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;

            if (!localStorage.getItem("sushiPromos")) {
                localStorage.setItem("sushiPromos", JSON.stringify(initialPromos));
            }

            container.innerHTML = "";

            Object.keys(categoriesMap).forEach(catKey => {
                const itemsInCat = promos.filter(p => (p.categoria || 'promos') === catKey);
                if (itemsInCat.length > 0) {
                    container.innerHTML += `
                        <section class="category-section" id="${catKey}">
                            <div class="category-title">${categoriesMap[catKey]}</div>
                            <div class="menu-list">
                                ${itemsInCat.map(promo => `
                                    <div class="menu-item">
                                        <div class="img-container">
                                            <img src="${promo.imagen}" alt="${promo.nombre}">
                                            ${promo.badge ? `<span class="badge-promo">${promo.badge}</span>` : ''}
                                        </div>
                                        <div class="item-content">
                                            <div class="item-name">${promo.nombre}</div>
                                            <div class="item-price">${promo.precio}</div>
                                            <p class="item-desc">${promo.descripcion}</p>
                                        </div>
                                        <div class="cart-controls">
                                            <button class="btn-qty" onclick="updateQty(${promo.id}, -1)">-</button>
                                            <span class="qty-number" id="qty-${promo.id}">${cart[promo.id] || 0}</span>
                                            <button class="btn-qty" onclick="updateQty(${promo.id}, 1)">+</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                }
            });
            updateCartBar();
        }

        function updateQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            const qtyElem = document.getElementById(`qty-${id}`);
            if (qtyElem) qtyElem.innerText = cart[id] || 0;
            updateCartBar();
        }

        function updateCartBar() {
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let totalItems = 0, totalPrice = 0;
            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    totalItems += cart[id];
                    totalPrice += parsePrice(item.precio) * cart[id];
                }
            }
            const bar = document.getElementById("cartBar");
            if (totalItems > 0) {
                bar.style.display = "flex";
                document.getElementById("cartCount").innerText = `${totalItems} productos`;
                document.getElementById("cartTotal").innerText = formatPrice(totalPrice);
            } else {
                bar.style.display = "none";
            }
        }

        function openCartModal() {
            const list = document.getElementById("modalCartList");
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let html = "", totalPrice = 0;
            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    const subtotal = parsePrice(item.precio) * cart[id];
                    totalPrice += subtotal;
                    html += `<div style="display:flex; justify-between; margin-bottom:10px;">
                        <div><b>${item.nombre}</b> x${cart[id]}</div>
                        <div>${formatPrice(subtotal)}</div>
                    </div>`;
                }
            }
            list.innerHTML = html;
            document.getElementById("modalTotal").innerText = formatPrice(totalPrice);
            document.getElementById("cartModal").style.display = "flex";
        }

        function closeCartModal() { document.getElementById("cartModal").style.display = "none"; }

        function processInternalOrder() {
            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let orderItems = [], totalPrice = 0;

            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    const subtotal = parsePrice(item.precio) * cart[id];
                    totalPrice += subtotal;
                    orderItems.push({ nombre: item.nombre, cantidad: cart[id], subtotal });
                }
            }

            const orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            orders.push({ id: orderId, items: orderItems, total: totalPrice, fecha: new Date().toISOString(), estado: "Pendiente" });
            localStorage.setItem("sushiInternalOrders", JSON.stringify(orders));

            alert(`Pedido ${orderId} enviado a Cocina/Admin.`);
            cart = {};
            renderMenu();
            closeCartModal();
        }

        renderMenu();
    </script>
</body>
</html>
