<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Sushi - Sabores de Tokio</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --card-border: #21262d;
            --accent-color: #ff4757;
            --primary-btn: #3fb950;
            --wsp-btn: #25d366;
            --warning-color: #d29922;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 110px;
        }

        /* Encabezado */
        header {
            padding: 16px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        header h1 {
            font-size: 1.3rem;
            letter-spacing: 1px;
            font-weight: 800;
        }

        header p {
            color: var(--accent-color);
            margin-top: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .btn-admin-header {
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid var(--accent-color);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Navegación Rápida */
        .quick-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            scrollbar-width: none;
        }

        .quick-nav::-webkit-scrollbar { display: none; }

        .quick-nav a {
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
            white-space: nowrap;
        }

        /* Categorías y Productos */
        .category-section {
            scroll-margin-top: 20px;
            margin-bottom: 28px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .category-title {
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-list { display: flex; flex-direction: column; gap: 12px; }

        .menu-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .img-container { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
        .menu-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .badge-promo {
            position: absolute;
            top: 4px;
            left: 4px;
            background-color: var(--accent-color);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 800;
        }

        .item-content { flex: 1; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .item-price { color: var(--accent-color); font-weight: 700; font-size: 0.95rem; }
        .item-desc { color: var(--text-muted); font-size: 0.78rem; }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--bg-color);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--card-border);
        }

        .btn-qty {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .qty-number { font-weight: 700; font-size: 0.85rem; min-width: 20px; text-align: center; }

        /* Barra del Carrito */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background-color: #1c2128;
            border: 1px solid var(--primary-btn);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .btn-open-cart {
            background-color: var(--primary-btn);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 14px; width: 100%; max-width: 480px;
            max-height: 90vh; display: flex; flex-direction: column;
            border: 1px solid var(--card-border);
        }

        .modal-header { padding: 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px; border-top: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 10px; }

        /* Formulario del Cliente */
        .client-form {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .client-form h3 {
            font-size: 0.95rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-row input { flex: 1; }

        .client-form input, .client-form select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background-color: var(--bg-color);
            color: #fff;
            font-size: 0.85rem;
        }

        .client-form label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: -4px;
        }

        .btn-checkout { background-color: var(--primary-btn); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-wsp-checkout { background-color: var(--wsp-btn); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Estado del pedido */
        .order-status-screen { text-align: center; padding: 24px 12px; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--card-border);
            border-top: 4px solid var(--warning-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div>
                <h1>SABORES DE TOKIO</h1>
                <p>Carta Digital</p>
            </div>
            <a href="admin.html" class="btn-admin-header">⚙️ Admin</a>
        </div>
    </header>

    <div class="quick-nav">
        <a href="#mas-vendidos">🔥 Más Vendidos</a>
        <a href="#promos">🏷️ Promos</a>
        <a href="#para-uno">👤 Para Uno</a>
        <a href="#handrolls">🌯 Handrolls</a>
        <a href="#gohan">🍚 Gohan</a>
        <a href="#bebestibles">🥤 Bebestibles</a>
    </div>

    <div id="sectionsContainer"></div>

    <!-- Barra Flotante -->
    <div class="cart-bar" id="cartBar" style="display: none;">
        <div>
            <span id="cartCount" style="font-size: 0.8rem; color: var(--text-muted); display: block;">0 ítems</span>
            <span id="cartTotal" style="font-size: 1.1rem; font-weight: 800; color: #fff;">$0</span>
        </div>
        <button class="btn-open-cart" onclick="openCartModal()">Ver Carrito 🛒</button>
    </div>

    <!-- Modal Carrito -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Resumen de tu Pedido</h2>
                <button style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;" onclick="closeCartModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div id="modalCartList"></div>

                <!-- Formulario con Datos del Cliente -->
                <form id="orderForm" class="client-form" onsubmit="event.preventDefault(); processInternalOrder();">
                    <h3>Datos para la Entrega</h3>
                    
                    <div class="form-row">
                        <div>
                            <label>Nombre *</label>
                            <input type="text" id="clientNombre" required placeholder="Juan">
                        </div>
                        <div>
                            <label>Apellido *</label>
                            <input type="text" id="clientApellido" required placeholder="Pérez">
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label>Teléfono *</label>
                            <input type="tel" id="clientTelefono" required placeholder="+56912345678">
                        </div>
                        <div>
                            <label>Correo *</label>
                            <input type="email" id="clientCorreo" required placeholder="juan@email.com">
                        </div>
                    </div>

                    <div>
                        <label>Dirección de Entrega *</label>
                        <input type="text" id="clientDireccion" required placeholder="Calle, número, depto / comuna">
                    </div>

                    <div>
                        <label>Método de Pago *</label>
                        <select id="clientMetodoPago" required>
                            <option value="Efectivo">💵 Efectivo</option>
                            <option value="Transferencia">💳 Transferencia Bancaria</option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="modal-footer" id="modalFooter">
                <div style="display:flex; justify-between; font-weight:800;">
                    <span>Total:</span>
                    <span id="modalTotal">$0</span>
                </div>
                <button class="btn-checkout" onclick="submitOrder('cocina')">Enviar Pedido a Cocina 🛍️</button>
                <button class="btn-wsp-checkout" onclick="submitOrder('whatsapp')">Enviar por WhatsApp 💬</button>
            </div>
        </div>
    </div>

    <script>
        const categoriesMap = {
            'mas-vendidos': '🔥 Más Vendidos',
            'promos': '🏷️ Promos',
            'para-uno': '👤 Para Uno',
            'handrolls': '🌯 Handrolls',
            'gohan': '🍚 Gohan',
            'bebestibles': '🥤 Bebestibles'
        };

        const initialPromos = [
            { id: 1, nombre: "Promo 1: Sake Mix", precio: "$8.900", badge: "TOP VENDIDO", categoria: "mas-vendidos", descripcion: "10 pcs Sake Avocado Roll + 2 Nigiris + Bebida.", imagen: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=300&q=80" },
            { id: 2, nombre: "Promo Duo Tokio", precio: "$14.900", badge: "2x1 PROMO", categoria: "promos", descripcion: "10 pcs Ebi Roll + 10 pcs Tori Roll + 4 Gyozas.", imagen: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=300&q=80" },
            { id: 3, nombre: "Combo Personal", precio: "$6.500", badge: "SOLO PARA 1", categoria: "para-uno", descripcion: "10 pcs Rolls a elección + Bebida 350ml.", imagen: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=300&q=80" }
        ];

        let cart = {};
        let orderPollInterval = null;

        function parsePrice(p) { return parseInt(p.replace(/[^0-9]/g, '')) || 0; }
        function formatPrice(n) { return '$' + n.toLocaleString('es-CL'); }

        function renderMenu() {
            const container = document.getElementById("sectionsContainer");
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;

            if (!localStorage.getItem("sushiPromos")) {
                localStorage.setItem("sushiPromos", JSON.stringify(initialPromos));
            }

            container.innerHTML = "";

            Object.keys(categoriesMap).forEach(catKey => {
                const itemsInCat = promos.filter(p => (p.categoria || 'promos') === catKey);
                if (itemsInCat.length > 0) {
                    container.innerHTML += `
                        <section class="category-section" id="${catKey}">
                            <div class="category-title">${categoriesMap[catKey]}</div>
                            <div class="menu-list">
                                ${itemsInCat.map(promo => `
                                    <div class="menu-item">
                                        <div class="img-container">
                                            <img src="${promo.imagen}" alt="${promo.nombre}">
                                            ${promo.badge ? `<span class="badge-promo">${promo.badge}</span>` : ''}
                                        </div>
                                        <div class="item-content">
                                            <div class="item-name">${promo.nombre}</div>
                                            <div class="item-price">${promo.precio}</div>
                                            <p class="item-desc">${promo.descripcion}</p>
                                        </div>
                                        <div class="cart-controls">
                                            <button class="btn-qty" onclick="updateQty(${promo.id}, -1)">-</button>
                                            <span class="qty-number" id="qty-${promo.id}">${cart[promo.id] || 0}</span>
                                            <button class="btn-qty" onclick="updateQty(${promo.id}, 1)">+</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                }
            });
            updateCartBar();
        }

        function updateQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            const qtyElem = document.getElementById(`qty-${id}`);
            if (qtyElem) qtyElem.innerText = cart[id] || 0;
            updateCartBar();
            renderModalCart();
        }

        function updateCartBar() {
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let totalItems = 0, totalPrice = 0;
            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    totalItems += cart[id];
                    totalPrice += parsePrice(item.precio) * cart[id];
                }
            }
            const bar = document.getElementById("cartBar");
            if (totalItems > 0) {
                bar.style.display = "flex";
                document.getElementById("cartCount").innerText = `${totalItems} productos`;
                document.getElementById("cartTotal").innerText = formatPrice(totalPrice);
            } else {
                bar.style.display = "none";
            }
        }

        function renderModalCart() {
            const list = document.getElementById("modalCartList");
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let html = "", totalPrice = 0;
            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    const subtotal = parsePrice(item.precio) * cart[id];
                    totalPrice += subtotal;
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <div>
                                <div><b>${item.nombre}</b></div>
                                <div style="font-size:0.8rem; color:var(--text-muted);">${item.precio} c/u &bull; ${formatPrice(subtotal)}</div>
                            </div>
                            <div class="cart-controls">
                                <button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button>
                                <span class="qty-number">${cart[id]}</span>
                                <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>`;
                }
            }
            list.innerHTML = html;
            document.getElementById("modalTotal").innerText = formatPrice(totalPrice);
        }

        function openCartModal() {
            document.getElementById("modalTitle").innerText = "Resumen de tu Pedido";
            document.getElementById("modalFooter").style.display = "flex";
            renderModalCart();
            document.getElementById("cartModal").style.display = "flex";
        }

        function closeCartModal() {
            if (orderPollInterval) clearInterval(orderPollInterval);
            document.getElementById("cartModal").style.display = "none";
        }

        function submitOrder(destination) {
            const form = document.getElementById("orderForm");
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            if (destination === 'cocina') {
                processInternalOrder();
            } else if (destination === 'whatsapp') {
                sendWhatsAppOrder();
            }
        }

        function getOrderDetails() {
            const promos = JSON.parse(localStorage.getItem("sushiPromos")) || initialPromos;
            let orderItems = [], totalPrice = 0;

            for (const id in cart) {
                const item = promos.find(p => p.id == id);
                if (item) {
                    const subtotal = parsePrice(item.precio) * cart[id];
                    totalPrice += subtotal;
                    orderItems.push({ nombre: item.nombre, cantidad: cart[id], subtotal });
                }
            }

            const cliente = {
                nombre: document.getElementById("clientNombre").value.trim(),
                apellido: document.getElementById("clientApellido").value.trim(),
                telefono: document.getElementById("clientTelefono").value.trim(),
                correo: document.getElementById("clientCorreo").value.trim(),
                direccion: document.getElementById("clientDireccion").value.trim(),
                pago: document.getElementById("clientMetodoPago").value
            };

            return { items: orderItems, total: totalPrice, cliente };
        }

        function processInternalOrder() {
            const { items, total, cliente } = getOrderDetails();
            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);

            const orderData = {
                id: orderId,
                cliente,
                items,
                total,
                fecha: new Date().toISOString(),
                estado: "Pendiente"
            };

            const orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            orders.push(orderData);
            localStorage.setItem("sushiInternalOrders", JSON.stringify(orders));

            document.getElementById("modalFooter").style.display = "none";
            showWaitingState(orderId);

            if (orderPollInterval) clearInterval(orderPollInterval);
            orderPollInterval = setInterval(() => checkOrderStatus(orderId), 2500);
        }

        function sendWhatsAppOrder() {
            const { items, total, cliente } = getOrderDetails();
            const wspNumber = localStorage.getItem("sushiWspNumber") || "56912345678";

            let msg = `🍣 *NUEVO PEDIDO - SABORES DE TOKIO*\n\n`;
            msg += `👤 *Cliente:* ${cliente.nombre} ${cliente.apellido}\n`;
            msg += `📞 *Teléfono:* ${cliente.telefono}\n`;
            msg += `📧 *Correo:* ${cliente.correo}\n`;
            msg += `📍 *Dirección:* ${cliente.direccion}\n`;
            msg += `💳 *Método de Pago:* ${cliente.pago}\n\n`;
            msg += `🛒 *Detalle del Pedido:*\n`;

            items.forEach(item => {
                msg += `• ${item.cantidad}x ${item.nombre} - ${formatPrice(item.subtotal)}\n`;
            });

            msg += `\n💰 *Total:* ${formatPrice(total)}`;

            const url = `https://api.whatsapp.com/send?phone=${wspNumber}&text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function showWaitingState(orderId) {
            document.getElementById("modalTitle").innerText = "Procesando Pedido";
            document.getElementById("modalCartList").innerHTML = `
                <div class="order-status-screen">
                    <div class="spinner"></div>
                    <h3 style="color: var(--warning-color);">Esperando Confirmación</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px;">
                        Enviamos tu pedido a la cocina. Te notificaremos aquí cuando sea aceptado.
                    </p>
                    <div style="background:#0d0f12; padding:8px; border-radius:6px; margin-top:12px; font-family:monospace; color:var(--accent-color);">
                        Código: ${orderId}
                    </div>
                </div>
            `;
            document.getElementById("orderForm").style.display = "none";
        }

        function checkOrderStatus(orderId) {
            const orders = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            const currentOrder = orders.find(o => o.id === orderId);

            if (!currentOrder) {
                clearInterval(orderPollInterval);
                document.getElementById("modalTitle").innerText = "Pedido Rechazado";
                document.getElementById("modalCartList").innerHTML = `
                    <div class="order-status-screen">
                        <div style="font-size:3rem;">❌</div>
                        <h3 style="color: var(--accent-color);">Pedido Rechazado</h3>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px;">
                            Lo sentimos, no podemos tomar tu pedido en este momento.
                        </p>
                        <button class="btn-checkout" style="margin-top:16px;" onclick="clearCartAndClose()">Volver</button>
                    </div>
                `;
                return;
            }

            if (currentOrder.estado === "Aprobado") {
                clearInterval(orderPollInterval);
                document.getElementById("modalTitle").innerText = "¡Pedido Aprobado!";
                document.getElementById("modalCartList").innerHTML = `
                    <div class="order-status-screen">
                        <div style="font-size:3rem;">👨‍🍳</div>
                        <h3 style="color: var(--primary-btn);">¡Tu pedido está en preparación!</h3>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px;">
                            La cocina aceptó tu pedido y se está preparando para el envío.
                        </p>
                        <button class="btn-checkout" style="margin-top:16px;" onclick="clearCartAndClose()">Entendido</button>
                    </div>
                `;
            }
        }

        function clearCartAndClose() {
            if (orderPollInterval) clearInterval(orderPollInterval);
            cart = {};
            document.getElementById("orderForm").reset();
            document.getElementById("orderForm").style.display = "flex";
            renderMenu();
            closeCartModal();
        }

        renderMenu();
    </script>
</body>
</html>
