<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Digital - Sushi & Restaurant</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.8rem;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .product-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-weight: bold;
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .btn-add {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
        }

        /* Cart Floating Button */
        .cart-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .cart-item-controls button {
            background: var(--border-color);
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: white;
        }

        .btn-submit {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #1eb857;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍣 Sushi Express</h1>
        <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 5px;">Carta Digital & Pedidos Online</p>
    </header>

    <div class="container">
        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán dinámicamente -->
        </div>
    </div>

    <button class="cart-float-btn" onclick="openModal()">
        🛒 Carrito (<span id="cartCount">0</span>)
    </button>

    <!-- Modal Carrito y checkout -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="cartItemsList">
                <!-- Items del carrito -->
            </div>

            <div style="text-align: right; margin: 15px 0; font-weight: bold; font-size: 1.2rem; color: #38bdf8;">
                Total: $<span id="cartTotal">0</span>
            </div>

            <form id="orderForm" onsubmit="enviarPedido(event)">
                <h3 style="margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Datos para Entrega</h3>
                
                <div class="form-group">
                    <label for="clientName">Nombre completo *</label>
                    <input type="text" id="clientName" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="clientPhone">Teléfono de contacto *</label>
                    <input type="tel" id="clientPhone" placeholder="+56 9 1234 5678" required>
                </div>

                <div class="form-group">
                    <label for="clientAddress">Dirección de despacho</label>
                    <input type="text" id="clientAddress" placeholder="Ej: Av. Principal #123">
                </div>

                <div class="form-group">
                    <label for="clientEmail">Correo electrónico</label>
                    <input type="email" id="clientEmail" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="clientPayment">Método de Pago *</label>
                    <select id="clientPayment" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia Bancaria</option>
                        <option value="Débito / Crédito">Débito / Crédito</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Enviar Pedido a WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: Ingresa aquí el número de WhatsApp de TU NEGOCIO (con código de país sin '+')
        const NEGOCIO_WHATSAPP = "569XXXXXXXX"; 

        // Lista de Productos Disponibles
        const productos = [
            { id: 1, nombre: "Roll California Ebi", descripcion: "Camarón, queso crema y palta envuelto en sésamo", precio: 6500 },
            { id: 2, nombre: "Roll Sake Sake", descripcion: "Salmón y palta envuelto en salmón", precio: 7200 },
            { id: 3, nombre: "Handroll Pollo", descripcion: "Pollo ciboulette, queso crema empanizado", precio: 4500 },
            { id: 4, nombre: "Gyosas de Cerdo (5 un)", descripcion: "Empanaditas japonesas al vapor/doradas", precio: 3800 },
            { id: 5, nombre: "Promo 30 Cortes", descripcion: "10 California + 10 Tempura + 10 Avocado", precio: 15900 }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = productos.map(p => `
                <div class="product-card">
                    <div>
                        <div class="product-title">${p.nombre}</div>
                        <div class="product-desc">${p.descripcion}</div>
                    </div>
                    <div class="product-footer">
                        <span class="product-price">$${p.precio.toLocaleString('es-CL')}</span>
                        <button class="btn-add" onclick="addToCart(${p.id})">+ Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = productos.find(p => p.id === id);
            const itemInCart = cart.find(item => item.id === id);

            if (itemInCart) {
                itemInCart.cantidad++;
            } else {
                cart.push({ ...prod, cantidad: 1 });
            }
            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                cart[itemIndex].cantidad += delta;
                if (cart[itemIndex].cantidad <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById("cartCount");
            const cartTotal = document.getElementById("cartTotal");
            const cartItemsList = document.getElementById("cartItemsList");

            const totalItems = cart.reduce((sum, item) => sum + item.cantidad, 0);
            const totalMoney = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            cartCount.textContent = totalItems;
            cartTotal.textContent = totalMoney.toLocaleString('es-CL');

            if (cart.length === 0) {
                cartItemsList.innerHTML = `<p style="color: var(--text-sub); text-align: center; margin: 20px 0;">El carrito está vacío</p>`;
                return;
            }

            cartItemsList.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div><strong>${item.nombre}</strong></div>
                        <div style="font-size: 0.85rem; color: var(--text-sub);">$${(item.precio * item.cantidad).toLocaleString('es-CL')}</div>
                    </div>
                    <div class="cart-item-controls" style="display: flex; align-items: center; gap: 8px;">
                        <button onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button onclick="changeQuantity(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal() {
            document.getElementById("cartModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        function enviarPedido(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Tu carrito está vacío. Agrega productos antes de enviar.");
                return;
            }

            const nombre = document.getElementById("clientName").value.trim();
            const telefono = document.getElementById("clientPhone").value.trim();
            const correo = document.getElementById("clientEmail").value.trim();
            const direccion = document.getElementById("clientAddress").value.trim();
            const pago = document.getElementById("clientPayment").value;

            // 1. Crear Objeto de Pedido
            const orderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
            const total = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            const nuevoPedido = {
                id: orderId,
                fecha: new Date().toISOString(),
                estado: "Pendiente",
                cliente: {
                    nombre: nombre,
                    telefono: telefono,
                    correo: correo,
                    direccion: direccion,
                    pago: pago
                },
                items: cart,
                total: total
            };

            // 2. Guardar en localStorage para que lo reciba el Panel Admin
            let ordenesInternas = JSON.parse(localStorage.getItem("sushiInternalOrders")) || [];
            ordenesInternas.push(nuevoPedido);
            localStorage.setItem("sushiInternalOrders", JSON.stringify(ordenesInternas));

            // 3. Crear el mensaje formateado para WhatsApp
            let mensaje = `🍣 *NUEVO PEDIDO (${orderId})*\n\n`;
            mensaje += `👤 *Cliente:* ${nombre}\n`;
            mensaje += `📞 *Teléfono:* ${telefono}\n`;
            if (direccion) mensaje += `📍 *Dirección:* ${direccion}\n`;
            if (correo) mensaje += `📧 *Correo:* ${correo}\n`;
            mensaje += `💳 *Método de Pago:* ${pago}\n\n`;
            mensaje += `📋 *Detalle del Pedido:*\n`;

            cart.forEach(item => {
                mensaje += `• ${item.cantidad}x ${item.nombre} - $${(item.precio * item.cantidad).toLocaleString('es-CL')}\n`;
            });

            mensaje += `\n💰 *Total a Pagar:* $${total.toLocaleString('es-CL')}`;

            // 4. Limpiar estado
            cart = [];
            updateCartUI();
            closeModal();
            document.getElementById("orderForm").reset();

            // 5. Redirigir al WhatsApp de la tienda
            const urlWhatsApp = `https://wa.me/${NEGOCIO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }

        // Inicializar
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
